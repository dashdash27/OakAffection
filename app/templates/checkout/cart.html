{% extends "base.html" %}

{% block title %}Корзина{% endblock %}
{% block description %}{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checkout/cart.css') }}">
{% endblock %}

{% block js %}
    
{% endblock %}

{% block content %}
    <section class="cart">
        <div class="container">
            <h1 class="cart__title">
                Корзина
            </h1>
            <div class="cart__table">
                <div class="cart__table-header">
                    <div class="cart__col">Товар</div>
                    <div class="cart__col">Количество</div>
                    <div class="cart__col">Цена</div>
                    <div class="cart__col">Удалить</div>
                </div>
                <div class="cart__items">

                </div>  
            </div>

            <template class="cart__item-template">
                <div class="cart__item" data-id="">
                    <div class="cart__item-info">
                        <div class="cart__item-img-wrapper">
                            <img src="" alt="" class="cart__item-img">
                        </div>
                        <div class="cart__item-text">
                            <a href="" class="cart__item-name">
                                
                            </a>
                            <div class="cart__item-variant"></div>
                        </div>
                    </div>

                    <div class="cart__item-controls">
                        <button class="cart-item__btn-minus">-</button>
                        <span class="cart-item__count"></span>
                        <button class="cart-item__btn-plus">+</button>
                    </div>

                    <div class="cart__item-total"></div>

                    <button class="cart__item-remove">Удалить</button>

                </div>
            </template>

        </div>
    </section>
    <script src="{{ url_for('static', filename='js/checkout/cart.js') }}"></script>
{% endblock %}
